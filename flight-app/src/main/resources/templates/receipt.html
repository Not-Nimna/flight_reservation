<!DOCTYPE html>
<html>
<head>
    <title>Payment Receipt</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
        }
        .container {
            width: 80%;
            margin: 0 auto;
            padding: 20px;
        }
        .header {
            text-align: center;
        }
        .receipt-details {
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Payment Receipt</h1>
        </div>
        <div class="receipt-details">
            <p>Dear {{recipientName}},</p>
            <p>Thank you for your payment. Below are the details of your transaction:</p>
            <table>
                <tr>
                    <td>Amount Paid:</td>
                    <td>{{amountPaid}}</td>
                </tr>
                <tr>
                    <td>Payment Date:</td>
                    <td>{{paymentDate}}</td>
                </tr>
                
            </table>
            <p>If you have any questions or concerns, please do not hesitate to contact us.</p>
            <p>Best regards,</p>
            <p>Flight App</p>
        </div>
    </div>
</body>
</html>
